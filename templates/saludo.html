<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saludo - Mi App</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #252538);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2e2e40;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 360px;
            width: 85%;
            border: 1px solid #3d3d56;
        }
        h1 { color: #00f5d4; margin: 0 0 15px 0; font-size: 28px; }
        p { color: #b3b3cc; font-size: 15px; line-height: 1.6; margin-bottom: 30px; }
        .btn-back {
            color: #00f5d4;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border: 2px solid #00f5d4;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Hola, {{ nombre }}!</h1>
        <p>Python recibió tu nombre correctamente y renderizó esta plantilla independiente.</p>
        <a href="/" class="btn-back">Volver al inicio</a>
    </div>
</body>
</html>
